repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # v0.17.0
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: local
  hooks:
    - id: ty
      name: ty
      entry: uv run ty check
      language: system
      types: [python]
      pass_filenames: false
    - id: flake8-rampart
      name: flake8-rampart
      entry: uv run flake8
      language: system
      # flake8 scans its whole configured scope, so trigger on any Python file
      # (mirroring the ty hook above) plus the config itself. `types` is omitted
      # so that .flake8, which is not Python, still triggers the hook.
      files: (\.py$|^\.flake8$)
      pass_filenames: false
